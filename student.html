<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard — DB Tech Tamil Nadu</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/logo.png" alt="DB Tech">
      <div class="name">DB Tech<small>Tamil Nadu Live Ops</small></div>
    </div>
    <nav class="nav">
      <a href="dashboard.html"><i data-icon="grid"></i> Overview</a>
      <a href="batch.html"><i data-icon="layers"></i> Batches</a>
      <a href="student.html" class="active"><i data-icon="users"></i> Students</a>
    </nav>
    <div class="role-box" id="role-box"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn menu-toggle" id="menu-toggle" aria-label="Menu"><i data-icon="menu"></i></button>
        <div class="title-block">
          <h1>Student Dashboard</h1>
          <div class="sub" id="last-updated">Connecting to live sheet…</div>
        </div>
      </div>
      <div class="right">
        <div class="clock" id="live-clock"></div>
        <button class="btn btn-primary" id="refresh-btn"><i data-icon="refresh"></i> Refresh</button>
      </div>
    </header>
    <div class="pulse-strip" id="pulse-strip"><div class="fill" id="pulse-fill"></div></div>

    <main class="content">
      <div class="filter-bar">
        <input type="text" id="f-search" placeholder="Search name, student ID, batch…">
        <select id="f-center"><option value="">All centers</option></select>
        <select id="f-batch"><option value="">All batches</option></select>
        <select id="f-status"><option value="">All attendance</option><option value="Present">Present today</option><option value="Absent">Absent today</option></select>
        <select id="f-residential"><option value="">Residential: all</option><option value="Yes">Residential only</option><option value="No">Non-residential only</option></select>
        <button class="btn" id="f-clear">Clear filters</button>
        <button class="btn btn-accent" id="f-export" style="margin-left:auto;"><i data-icon="download"></i> Export CSV</button>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="data-table" id="table-students">
            <thead><tr>
              <th data-sort="studentName">Student Name</th><th data-sort="studentId">Student ID</th><th data-sort="batchId">Batch</th>
              <th data-sort="attendancePct">Attendance %</th><th>Today's Status</th><th>LMS 1</th><th>LMS 2</th>
              <th>Assessment</th><th>Wadhwani Progress</th><th>Residential Status</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="hint" id="row-count" style="margin-top:10px;"></div>
    </main>

    <footer class="site-footer">© Don Bosco Tech Society - Tamil Nadu State Operations</footer>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/student.js"></script>
</body>
</html>
